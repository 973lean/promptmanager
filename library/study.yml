# Study: part of the Prompt Manager library (Import → Load my library)
matches:
- trigger: ":summary"
  replace: Please synthesize a lean, 'ultimate summary' for these lecture slide notes which puts in the core ideas in an executive one-pager to prepend to this google doc tab. It must be lean and is a practical 'cheat sheet' that the user can look at and immediately get assistance/knowledge for the concepts for questions/problems on this topic. Must be in bullet points. Include key formulas, definitions, relationships, described minimum viable to be helpful. One page maximum, no more. Prepend a 1-2 sentence memo with Grade 6 logic summary on the whole lecture/notes. Do not include a sources bullet list at the bottom. Include an H2 title that contains lecture_name_term and 'ultimate summary'.
- trigger: ":reasoning"
  replace: 'Chain it. I have zero clue how to solve this. Reasoning chain only: numbered steps, one short sentence each, minimal viable number of steps; the critical path. Skip mechanical setup (unit/rate conversions, counting periods) — only the conceptual moves. No arithmetic, no worked numbers, no final answer, no preamble, no explanation. Name the formula family in one line before the steps. Flag the single most common trap in one line. Cite the unit document. If I''m missing a prerequisite to follow the chain, say so in one line. Exempt the ''sources'' panel only from this output, do not include it at the bottom.'
- trigger: ":parallel"
  replace: 'Write a parallel problem: same underlying logic and solution structure, different names and numbers. Solve it step by step. Be terse — no restating the problem, no preamble, no recap. One line per step, showing only the operation and the reasoning that picks it. End with one line naming the transferable pattern. Exempt the ''sources'' panel only from this output, do not include it at the bottom.'
- trigger: ":notes"
  label: Lecture notes
  replace: |-
    ## Role  You are a world-class university note taker and master in human psychology for readability and information transfer for optimal study.
    ## Task Convert this lecture slides into complete reference notes.
    ## CONTENT - Include every formula, definition, and method — omit nothing. - Include step-by-step how-to guides for solving each problem type. - No overall title, intro, summary, conclusion, or transitions — start at the first section header. - Use a header per section; phrase everything as compactly as possible without losing meaning. - Include examples for problem-solving where provided, do not make this up - Leave key definitions and phrasing verbatim where applicable and there is no ambiguity
    ## FORMATTING (Google Docs paste-ready) - Put all equations, variables, and symbols in inline backticks: `Y = C + I + G`. - Never use LaTeX delimiters ($, $$) or fenced code blocks — inline backticks only. - Numbered lists: sequential numbering, one item per line, no blank lines between items, no line breaks inside an item.
    ## EXTRAS  - Give the single term for the title of this lecture/notes topic (max 4 words, ideally 2-3)
    Please begin
- trigger: ":gap"
  replace: |-
    Log the error I just made as a gap entry, nothing else — a bolded title line then seven bullets, one sentence each, each header term such as summary, analogy, wrong, etc. is bolded while the sentence is normal text:
    Gap: **<concept name, 3–5 words>**
    * **Summary**: <what I was doing and what I got wrong, in context> * **Analogy**: <primary-school analogy for the underlying logic> * **Wrong**: <the exact figure or classification I gave> * **Why wrong**: <the misconception, one clause> * **Right**: <correct figure or classification only, no working> * **Why right**: <the principle that makes it correct, one clause> * **Revise**: <human-readable location, e.g. 'Lecture 2 — opportunity cost', not a filename>
    No preamble, no examples, no encouragement. Then resume or prepare to resume the previous task and never mention this entry again unless I ask for my gap list. Tell or remind user in one sentence what's next to go on with.
- trigger: ":questions"
  replace: |-
    ## Role You are a world-class university note taker and master in human psychology for readability and information transfer for optimal study.
    ##Task Reformat the question set below for maximum readability so the user can work through it. Do not solve, answer, hint, or add commentary. Ready to paste into google docs, only using H3 and regular text for formatting.
    ## CONTENT * Preserve every question, sub-part, number, symbol, table, and given value exactly — omit nothing, add nothing. * Keep original wording verbatim; only fix broken line breaks, stray characters, and mangled spacing from the paste. * Keep original question and sub-part numbering; nest sub-parts under their parent. * Split dense question blocks into separate lines per instruction, given value, or required output so nothing is buried in a wall of text. * Keep any provided data, tables, or exhibits attached to the question that uses them. * No overall title, intro, summary, conclusion, or transitions — start at the first question. * add hr between each task, and also please add an indentation to each question like a), b). etc. * do not include a sources list at the bottom
    ##QUESTIONS
- trigger: ":stepcheck"
  replace: |-
    STEP-CHECK MODE
    ## INPUT: my numbered reasoning chain, one line per step.
    ## TASK: 1. Locate the FIRST broken step. Ignore all downstream steps. 2. Classify the break: sign | exponent | wrong formula family | wrong dating | wrong unit basis | unjustified assertion. 3. State the error in one line. If the step is correct but unjustified, ask the one question that tests understanding. 4. Issue ONE next step, phrased as an instruction producing a specific number or expression. Stop there.
    ## CONSTRAINTS: - No preamble, praise, restatement, or recap. - 1 sentence per point; 2 max where load-bearing. - No arithmetic I can do. No final answer. No full solution unless I say 'give me the answer'. - Formula shape questions: derive from the family's base formula, don't assert. - Valid but non-standard method: say so, don't redirect. - Cite unit document for formulas and conventions. - No sources panel in this output.
    END: ask for my output on the one next step.
- trigger: ":memo"
  replace: |-
    Your job is to simply put a reminder on the user's incorrect premise/assumptions and reinforce the difference in the user's mind. A short, lean, concise and readable note that can be easily skimmed over that communicates the message efficiently, such as the format below:
    Note_Name (max. 10-16 words header sentence describing the topic/mistake) * Basically: (a kid level analogy on what the user got wrong, and the logic of the correct answer / what to do next time) (INCLUDE 'VISUAL' ONLY WHERE APPLICABLE TO QUICKLY REPRESENT THE FORMULA/QUESTION TYPE/PRINCIPLE) * Visual: (not a real image, but showing the 'symbol' of what is being talked about which will mainly where applicable be about formulas. Ex. 1: a graph formula 'QD = C - PX'. Ex. 2: showing directly related keywords: 'PS, CS, TR' or 'SMB + SMC = MEC', etc. Main point is to accurately, quickly represent the principle bones for context.  (INCLUDE 'WRONG' ONLY IF THIS IS FOLLOWING AN INCORRECT ANSWER TO A QUESTION RATHER THAN USER SIMPLY CORRECTING KNOWLEDGE) * Wrong: (single sentence describing what the user got wrong, describing with the universal /general subject principle, and not the exact question context, i.e. can be applied to many questions.) * Right: (single sentence describing the real correct  * Principles: (single sentence describing the term definition, formula, or what information the user did not have that led them to fail this question.)
    Upon completion of this memo, you are not to dilute your context with this and are expected to await further user instructions to continue this session.
    Please now begin.
- trigger: ":notes-2"
  label: Document briefing
  replace: "## ROLE + TASK CONTEXT You are an elite executive assistant who synthesizes complex documents into comprehensive, concise, and highly actionable briefings using direct, confident language. ## INPUT/DYNAMIC CONTENT You will receive a raw text or PDF document containing varying amounts of context, data, or arguments. ## STEP-BY-STEP INSTRUCTIONS (1) Read the entire input document carefully to identify every crucial piece of information. (2) Extract all critical facts, key insights, and material points without omitting important context. (3) Format the extracted information into a dense, practical summary using many bullet points. Structure all points in a consistent, well-formatted way that is easy to scan. Do not skip any detail that may be useful. Do not include any preamble, greetings, or conversational output — begin the briefing immediately with the first bullet point. ## GUARDRAILS + REMINDER * Do not omit any core information or high-leverage details. * Do not include meta-commentary, introductory fluff, or conversational filler. * Do not begin with greetings, preamble, or any sentence that is not part of the briefing itself. * Use consistent formatting throughout: bullet points for all structured information, clear hierarchy where needed. * Restate the critical requirement: Capture all important information — skipping nothing useful — in a consistently formatted, bullet-heavy, practical format. Begin now."
- trigger: ":esp"
  replace: evolutionary social psychology
