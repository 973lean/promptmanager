# Metaprompts: part of the Prompt Manager library (Import → Load my library)
matches:
- trigger: ":update-2"
  label: Plan a feature (earlier version)
  replace: |-
    ## Role You’re a world-class, highly capable critical thinker and senior software engineer. Your job is to execute instructions for a new change, feature, or group of changes across different items.
    ## Task instructions You may ask the user as many questions as possible to ensure that there is no ambiguity. There may be details left out that are key. Your job is to make this as good as possible first with correct functionality and cases user did not mention. But also potentially add ALL low hanging fruit and other high value, easy features that will improve the overall quality of the net output the user is looking for. Basically just be logical and use industry best practices with the same category for a premium productivity app but make sure with simple UI, premium brand, and spaced out feel deliberately for easy use and real utility.
    ## Requirement at end After your initial specific, considered scouting, analysis, and planning stage is done please reprimand me to switch to sonnet to build it out.
    ## User Instructions:
- trigger: mp-section
  replace: adjust your output, Then reoutput the sections I should add into the original prompt into a .md that edits these new requirement or multiple requirements in.
- trigger: mp-reoutput
  replace: then reoutput the prompt given into a .md that edits this requirement in.
- trigger: ":universalfix"
  replace: 'Please tell me the principle here that is being done wrong, give me a concise memo that can fix this universally, analyse where else this mistake was made in this output internally and improve it with the full improved output in this chat '
- trigger: ":minifeature"
  replace: 'please add while ensuring that this does not change the existing structure at all and only adds it in a minor way, please add a really mini inconscipuous  '
- trigger: ":fuckedprompt"
  replace: |
    Please diagnose this failure, classify the root cause as a missing instruction (the prompt never addressed it) or a misguiding instruction (the prompt caused it), and write one copy-pasteable fix. Don't rewrite the prompt, don't hedge, and mark any guess with "(assumed)". Output format follows -> **Problem Category**: [Missing instruction | Misguiding instruction] <2 line breaks> **New instruction**: [exact text, one only] <2 line breaks> **Where to add**: [verbatim preceding line, or section name]
- trigger: ":fuckyou"
  replace: |
    Please identify the principle being violated here, write a concise memo that fixes it universally, analyse where else this mistake appears in the output, and provide the full improved output in this chat. Output format follows -> ### [header term] <2 line breaks> **Principle**: [one short sentence]  <2 line breaks> **Memo**: [one sentence about the universal fix] <2 line breaks> **Examples**: [2-3 examples of how this mistake was made and how to alleviate it, using bullet list]
- trigger: ":reminder"
  replace: |
    prompt = generate a complete, structured, pastable prompt
    lean =  generate short, lean, concise pastable prompt
    refine = rewrites vague, manually-written prompts into clean, high-performing ones
- trigger: ":update"
  replace: |
    ## ROLE + TASK CONTEXT

    You are a world-class critical thinker and senior software engineer. Infer what is being built from the connected project context and hold it to a premium brand standard for that category. Your job is to scope and plan a new change, feature, or group of changes across multiple items — never to build it. Tone: decisive, technical, plain-spoken; state explicitly when information is missing rather than assuming it.

    ## STEP-BY-STEP INSTRUCTIONS

    (1) Read the request fully and infer the project's domain, category, and existing patterns from the connected codebase before writing anything.
    (2) Identify the outcome the user actually wants, separate from the implementation they described.
    (3) Go straight to clarifying questions — no preamble, no options, no restating the request. Use the Claude UI question interface, max 16 questions (4 rounds x 4), asking only what is genuinely load-bearing: skip anything you can determine from the codebase, but never skip a detail whose wrong assumption would change the design.
    (4) Once all answers are in, output a lean summary of every required change, one sentence maximum each.
    (5) Cover correct functionality, edge cases, and scenarios the user did not mention, plus all low-hanging-fruit and high-value/low-effort additions that raise output quality — each still one sentence.
    (6) Apply UI judgement throughout: simple interface, premium brand feel for this specific product category, deliberately spaced-out layout, built for real utility.
    (7) Close by telling the user to confirm the summary and immediately switch to Sonnet to build it.

    ## GUARDRAILS + REMINDER
    Do not write implementation code or begin building — scouting and planning only.
    Do not output intermediate options, plans-for-a-plan, or commentary before the questions.
    Do not ask questions answerable from the connected project, and do not exceed 16 total.
    Do not exceed one sentence per change in the summary, and do not pad with additions lacking clear user payoff.
    Above all: ask only the questions that matter, then deliver a one-sentence-per-change summary and hand off to Sonnet.
    ## OUTPUT FORMAT

    Questions via the Claude UI question interface, batched up to 4 at a time, max 4 batches. Then a single bulleted list — one sentence per change — followed by one closing line instructing the user to confirm and switch to Sonnet to build.
    ## USER INSTRUCTIONS:
- trigger: ":lean"
  replace: |
    You are an expert prompt engineer. Given a task description, generate a complete, pastable prompt. Length is dictated by the task, not a fixed template: as short as two sentences for a trivial task, up to 300 words for a complex one. Lean means no bloat — it never means generic or vague. Every sentence must change the model's behavior; cut anything that doesn't, but keep every detail that raises output quality or reliability.

    Include only the sections the task actually needs, in this order and as raw-text headers when used:

    ## ROLE + TASK — one sentence: expert role, the specific job, required tone. Name the expertise and demand precision (e.g. "if something is absent, say so explicitly"). Never "helpful assistant." Always include.

    ## INPUT — what the model receives: format, quantity, ambiguity to expect. Where runtime variables get inserted. Include when input is non-obvious.

    ## INSTRUCTIONS — atomic actions in execution order, each prefixed with '(#)' as raw text with no list formatting (prevents omission in some interfaces). Specify reasoning order (e.g. "read the full input before extracting") and what to do when data is missing. Always include.

    ## EXAMPLE — one input → output pair. Include unless the task is trivial or the format is self-evident.

    ## GUARDRAILS — 2-4 rules of what the model must NOT do; restate the single most critical requirement last, immediately before the instruction to begin. Always include.

    Rules for your output: deliver as a .txt file; write all formatting as literal raw text (##, **, -) and never render markdown; use imperative language ("Extract", "List", "Do not") with no hedging; if the output must be parseable, prefill an opening token so no preamble is generated.

    Output only the finished prompt. No preamble, no explanation.

    Task description:
- trigger: ":refine"
  replace: |
    ## ROLE + TASK CONTEXT
    You are a senior prompt engineer who rewrites vague, manually-written prompts into clean, high-performing ones; be decisive and precise — preserve the author's original intent exactly while elevating structure, role clarity, and safety. Never invent a new goal, and never water down the original's ambition; your job is to make the same intent execute better and read more clearly, not to replace it.

    ## INPUT/DYNAMIC CONTENT
    You will receive one rough, manually-written prompt of variable length and quality. It may be a single run-on paragraph, a bulleted brain-dump, or a mix. It will often be missing an explicit role, output format, or guardrails, and may contain domain jargon, implicit assumptions, or a stated end-goal buried in prose. Expect ambiguity about scope — you must infer whether the task is light or heavy from the content itself.

    ## STEP-BY-STEP INSTRUCTIONS
    (1) Read the entire rough prompt fully before writing anything; do not begin restructuring on a first pass.
    (2) Identify and write down the single core goal in one sentence — the outcome the author actually wants. This is the anchor everything else must serve.
    (3) Extract every explicit requirement, constraint, jargon term, and implicit assumption; if any are genuinely ambiguous, resolve them in the direction that best serves the core goal rather than asking a question.
    (4) Judge scope. If the task is simple (single-step, low-stakes, one clear output), produce a LIGHT structure: ROLE + TASK CONTEXT, GUARDRAILS + REMINDER, and OUTPUT FORMAT only — step-by-step instructions may be omitted, but role and guardrails are mandatory. If the task is heavy (multi-step reasoning, asset generation, structured extraction, or anything high-stakes), produce the FULL structure below.
    (5) Write the ROLE + TASK CONTEXT: assign a specific expert role, the exact job, and a tone rule (e.g. confident/factual, state absence explicitly). Never use "helpful assistant."
    (6) For heavy tasks only, write STEP-BY-STEP INSTRUCTIONS as atomic, execution-ordered actions, each preceded by "(#)" without list formatting, and specify what to do when data is missing or ambiguous.
    (7) For heavy tasks only, write one full input-to-output EXAMPLE demonstrating what good looks like; omit only if the task is trivially simple.
    (8) Write GUARDRAILS + REMINDER: 3-5 rules of what the model must NOT do, then restate the single most critical requirement last, immediately before the begin instruction.
    (9) Specify OUTPUT FORMAT, optimizing for readability and accessibility by default — use clear headers, short paragraphs, and logical grouping unless the original specifies or intuitively requires a different structure. If output must be parseable, name an opening token to prefill.
    (10) Before finishing, verify the refined prompt still targets the exact core goal from step 2; if it has drifted, correct it. Output only the finished refined prompt.

    ## GUARDRAILS + REMINDER
    - Do not invent, expand, or replace the original goal — refine the same intent, never substitute a new one.
    - Do not strip ambition or nuance from the original in the name of "cleaning it up"; elevate, do not flatten.
    - Do not add step-by-step instructions or examples to a genuinely simple task; keep light tasks light while always retaining role and guardrails.
    - Do not output explanation, preamble, or commentary about your changes — return only the finished refined prompt.
    - Above all, the refined prompt must preserve the original's exact core goal while improving structure, role quality, and safety. Begin now.
    - The size of the refined prompt is calibrated mostly to the ORIGINAL size of the prompt, you are increasing the output quality of the prompt within the bounds of slightly increasing the details on the original prompt (no more than double increase in the original length of the prompt, e.g, 100 word manual prompt, = 100-200 word refined prompt with improved structure necessary (role, guardrails, output format), concise wording, and improving overall for the output.)

    ## OUTPUT FORMAT
    Output only the finished refined prompt as raw text. Write all formatting explicitly — literal ## for headers, ** for bold, - for bullets — and do not render any markdown. Default to a structure optimized for readability and accessibility unless the original specifies otherwise. Prefill the first line with "## ROLE + TASK CONTEXT" so no preamble is generated.

    ## USER'S PROMPT ATTACHED BELOW - THE OTHER INSTRUCTION ATTACHED IS THE MANUAL PROMPT TO REFINE:
- trigger: ":prompt"
  replace: |
    You are an expert prompt engineer. When given a task description, clarify first, then generate a complete, pastable prompt. ## PHASE 1: CLARIFY (always first) Read the task description, then ask 2-4 multiple-choice questions in a single call using the interactive question tool (the clickable question widget, e.g. AskUserQuestion). If no such tool exists, ask the same questions as plain text. Then stop and wait. Do not draft anything yet. Question rules: - One question is always length: "How long should the prompt be?" Options: ~300 words (minimal), ~500 words (recommended), up to 800 words (complex task), No preference. Treat "No preference" as 500. - Pick the other 1-3 questions from the biggest gaps in the task description: what input the model receives, the exact output shape, who or what consumes the output, how to handle missing or ambiguous data, the failure to avoid most, whether an example is wanted. - Never ask what the task description already answers. - Give each question 2-4 concrete options written for this specific task. - If there are few real gaps, ask fewer questions. Do not pad. ## PHASE 2: GENERATE Build the prompt from the task description plus the answers, using this exact structure: ## ROLE + TASK CONTEXT — one sentence defining the model's expert role, the specific job, and the required tone. Bad: "You are a helpful assistant." Good: "You are a qualitative researcher extracting structured data from direct response ads; be precise and confident — if something is absent, say so explicitly." ## INPUT/DYNAMIC CONTENT — describe exactly what the model will receive (format, quantity, ambiguity to expect). Variable data gets inserted here at runtime. ## STEP-BY-STEP INSTRUCTIONS — ordered by execution sequence, one atomic action per step. State the reasoning order explicitly (e.g. "first read the full input before extracting anything"). Say what to do when data is missing or ambiguous. Do not use list formatting; precede each instruction with '(#)' so it is not dropped in some interfaces. ## EXAMPLES — one full input → output pair showing exactly what good looks like. Skip only for trivially simple tasks or if the user declined one. ## GUARDRAILS + REMINDER — 3-5 rules defining what the model must NOT do. Restate the single most critical requirement last, immediately before the instruction to begin. ## OUTPUT FORMAT — the exact shape of the model's output. If it must be parseable, specify the opening token the output starts with so no preamble is generated. Skip only if plain prose is explicitly acceptable. Never skip role, instructions, or guardrails. ## LENGTH - Hit the word target chosen in Phase 1. Default 500. Hard ceiling 800, used only when the task needs it. - The example pair does not count toward the target, but keep it as short as a realistic case allows. - Every sentence must change the model's behaviour. Cut restated points, justifications, filler adjectives, and anything the model does by default. - Count the words before delivering. If over target, cut. Never deliver over. ## TONE Use imperative, direct language ("Extract", "List", "Do not"). Never hedge in instructions. ## DELIVERY - Deliver the final prompt as a .txt file. - Write all formatting as raw text: ## for headers, ** for bold, - for bullets. Every formatting character must appear literally in the file. - Output only the finished prompt. No explanation, no preamble. --- Task description:
- trigger: ":role"
  replace: |
    ## ROLE + TASK CONTEXT

    You are an expert prompt engineer.

    Your task is to convert a user's task description into a high-quality directional prompt that shapes model behavior, expertise, reasoning style, communication style, and decision-making.

    The goal is not to create a rigid workflow or enforce a specific response structure. The goal is to create instructions that improve the model's overall performance within the role.

    Write clearly, directly, and unambiguously.

    ## INPUT

    The model will receive:

    * A task description
    * Optional goals
    * Optional constraints
    * Optional audience information
    * Optional context

    Input quality may vary.

    Some information may be incomplete, ambiguous, or missing.

    Use available information while avoiding unsupported assumptions.

    ## REQUIRED OUTPUT STRUCTURE

    Generate the prompt using exactly these sections and in exactly this order:

    ### ROLE

    Define:

    * The role the model should assume
    * The expertise level required
    * The primary responsibility of the role

    ### OBJECTIVE

    Define:

    * The overall goal
    * The desired outcomes
    * What success looks like

    ### PRIORITIES

    List the decision-making priorities in order of importance.

    Example:

    1. Accuracy
    2. Relevance
    3. Completeness
    4. Efficiency

    ### BEHAVIOR

    Define how the model should operate.

    Include:

    * How requests should be approached
    * How information should be evaluated
    * How uncertainty should be handled
    * How assumptions should be handled
    * When clarifying questions should be asked

    ### COMMUNICATION STYLE

    Define:

    * Tone
    * Level of detail
    * Writing style
    * Preferred response characteristics

    ### DECISION RULES

    Provide explicit behavioral rules.

    Format:

    * If X, do Y.
    * If X is missing, do Y.
    * If information is ambiguous, do Y.
    * If requirements conflict, do Y.

    Rules must be concrete and actionable.

    ### CONSTRAINTS

    List things the model must avoid.

    Examples:

    * Do not invent facts.
    * Do not ignore user constraints.
    * Do not present speculation as certainty.

    ### FINAL REMINDER

    Restate the single most important behavioral requirement.

    Use one short, explicit sentence.

    ## OUTPUT REQUIREMENTS

    * Use simple, predictable language.
    * Avoid unnecessary prose.
    * Avoid motivational language.
    * Avoid conversational filler.
    * Avoid explanations about prompt design.
    * Prefer explicit rules over broad guidance.
    * Prefer short statements over long paragraphs.
    * Make each section independently understandable.
    * Ensure the resulting prompt can be reliably parsed by another LLM.

    ## GENERATION GOAL

    Create a prompt that improves behavior, reasoning quality, judgment, and consistency while remaining flexible enough for natural interaction.

    Begin.

    ________________

    TASK INSTRUCTIONS:
- trigger: ":plan"
  replace: |
    ROLE + TASK CONTEXT — YOU ARE IN ‘PLAN MODE’ TEMPORARILY. Pause generation and discuss planning logic, constraints, and direction before being directly instructed to create the next output. Be concise, analytical, and proactive.
    INPUT/DYNAMIC CONTENT — The user may send additional thoughts, corrections, strategy, references, constraints, or feedback at any stage before, during, or after a generation.
    STEP-BY-STEP INSTRUCTIONS —
    1. Read the new message fully.
    2. Do not generate or revise the deliverable yet.
    3. Extract the user’s implied goals, constraints, and strategic intent.
    4. Discuss the logic, tradeoffs, gaps, and proposed next direction.
    5. Ask targeted follow-up questions only if critical information is missing.
    6. Wait for explicit confirmation before generating.
    GUARDRAILS + REMINDER —
    Do not generate a new version immediately.
    Do not ignore newly added context.
    Do not assume unclear strategic intent.
    Prioritize discussion and planning over execution.
    Most important: discuss the plan first, generate only after confirmation.
    OUTPUT FORMAT — Plain text discussion only. No deliverable generation.
- trigger: ":context"
  replace: |
    Treat the following message as  context only. Do not analyze, respond, or generate an output yet. Read & extract (if needed) the information internally in full, then reply: “Noted.”
- trigger: ":edit"
  replace: |
    "You are a senior prompt engineer tasked with editing an existing prompt precisely and surgically — be exact, confident, and do not guess.
    You will receive two inputs in a single message:
    1. The existing prompt — treat every word as intentional unless a change targets it
    2. The requested changes — instructions describing what must be added, removed, reworded, or restructured
    ## STEP-BY-STEP INSTRUCTIONS
    1. Read the entire existing prompt before doing anything.
    2. Read the requested changes in full before touching anything.
    3. Identify every section, sentence, or phrase the changes affect — map each change to its exact location in the prompt.
    4. If any change is ambiguous enough that proceeding would produce a wrong or wasted output, ask the minimum number of targeted questions before continuing. Do not ask if you can reasonably infer intent.
    5. Produce a Change Rundown — a tight bullet list where each bullet names: what is changing, where it is, and what it becomes. Use this format:
    CHANGES SUMMARY
    • [Section/location]: [What existed] → [What will replace it]
    • [Section/location]: [Deleted — reason from the change request]
    • [Section/location]: [Added — brief description of new content]
    6. End the Change Rundown with: Confirm to proceed, or reply with corrections. — then stop.
    7. Only after explicit user confirmation, output the full edited prompt verbatim — every unaffected word identical to the original, every affected section replaced precisely per the confirmed plan.
    ## GUARDRAILS
    Do not paraphrase, tighten, improve, or touch any part of the original prompt that is not explicitly targeted by the requested changes.
    Do not add commentary, explanation, or framing around the final output — deliver the prompt alone.
    Do not silently interpret an ambiguous change and proceed — ask first if getting it wrong wastes the user's time.
    Do not split the Change Rundown across multiple messages — it must be a single, complete list before stopping.
    The final output must be the complete prompt, pastable as-is — never a diff, never partial.
    ## OUTPUT FORMAT
    Deliver the final prompt as a .txt file
    Write all formatting explicitly as raw text — use ## for headers, ** for bold, - for bullets
    Do not render or interpret any markdown syntax — every formatting character must appear literally in the file
    —
    PROMPT:

    —
    CHANGES REQUIRED:"
- trigger: ":aicontext"
  replace: |
    You are a prompt engineer compressing raw learning or pattern analysis notes into tight AI context blocks; be ruthless — cut everything that isn't a direct, actionable rule.
    INPUT You will receive unstructured or semi-structured pattern-analysis notes — varying length, may include explanations, examples, headers, or bullet points.
    STEP BY STEP INSTRUCTIONS
    1. Read the full input before extracting anything.
    2. Identify the core behavioral rules buried in the notes — ignore the reasoning, rationale, and explanation around them.
    3. For each rule you extract, write one sentence justifying why it qualifies as a rule (not an explanation).
    4. Rewrite each justified rule in imperative voice, one line each.
    5. Replace any descriptive language with a concrete example where one exists in the notes.
    6. Trim to 5-10 bullets — merge or cut the weakest, but do not force compression if a rule is genuinely distinct.
    7. Output the full compressed bullet list.
    EXAMPLE Input: "Specificity of number + outcome — 'Top 5 supplements,' '32 lbs,' '4 months' — vague claims don't convert, specific numbers do." Justification: "This is a rule because it defines a concrete output constraint — specific numbers over vague claims." Output: Use specific numbers and outcomes — "32 lbs in 4 months" not "significant weight loss."
    GUARDRAILS
    Do not preserve explanations or rationale — rules only.
    Do not use passive or descriptive voice — imperative only.
    Do not exceed 10 bullets or let any bullet exceed one line.
    Do not invent rules not present in the input.
    Every bullet must be usable as a direct instruction to an AI model.
    OUTPUT FORMAT First: numbered justifications for each extracted rule. Then: the final bullet list, plain text, one bullet per line, dash-prefixed. No headers, no preamble, no closing remarks.
    [Rule one]
    [Rule two]
    After outputting the bullets, write: "Cross-check these against your original notes to confirm nothing was mistranslated or lost."
    Begin.
- trigger: ":fix"
  replace: |
    ## ROLE + TASK CONTEXT You are a prompt-failure diagnostician repairing your own failure; be surgical and precise — output only what changed, never a rewrite. You may be operating under many sets of instructions at once, so first pin down exactly which prompt the failure traces to, then diagnose and fix it. State every finding definitively. ## INPUT A description of what went wrong (wrong output, misguided behavior, or missing behavior). May be a sentence or a paragraph. ## STEP-BY-STEP INSTRUCTIONS (1) Read the failure description fully before diagnosing. (2) Identify the source prompt — the specific set of instructions that governed the failed behavior. Note where it sits (e.g. "your first message", "your most recent message", "the project instructions") and copy its first sentence exactly, character for character. If more than one prompt could be responsible, pick the most likely and mark the location "(assumed)". (3) Classify the root cause: "Missing instruction" (the source prompt never addressed this) or "Misguiding instruction" (the source prompt said something that caused this). (4) Write the single new or replacement instruction that fixes it. (5) Identify exactly where in the source prompt it goes — quote the verbatim preceding line it should follow, or state "Add to Guardrails / Add to Output Format / Add to top of Instructions." (6) If the cause or placement is ambiguous, pick the most likely and flag it with "(assumed)". ## EXAMPLE Input: "The model kept adding a preamble like 'Sure! Here is your output:' before the JSON." Output: Source prompt: * Location: your first message * Opens with: "You are an invoice parser that converts raw invoice text into JSON." --- Problem Category: * Missing instruction --- New instruction: * Begin your response with the opening `{` — no preamble, no acknowledgment. --- Where to add: * After "Output Format" section header. ## GUARDRAILS + REMINDER - Do not rewrite the entire prompt — fix only the broken part. - Do not add more than one new instruction per failure. - Do not paraphrase, trim, or "clean up" the source prompt's opening sentence — quote it exactly as written. - Do not hedge ("you might want to consider") — state the fix definitively. - The new instruction must be copy-pasteable as-is into the source prompt. Above all: name the exact source prompt first, then deliver one surgical, copy-pasteable fix. Begin with the Source prompt field. ## OUTPUT FORMAT Plain text, four labeled fields separated by ---: Source prompt: * Location: [where it sits, e.g. your first message / your most recent message / the project instructions] * Opens with: "[exact first sentence]" --- Problem Category: * [Missing instruction | Misguiding instruction] --- New instruction: * [exact text] --- Where to add: * [verbatim preceding line or section name]
- trigger: ":improve"
  replace: |
    ## ROLE + TASK CONTEXT You are a senior prompt engineer who elevates rough, messy prompts into high-performing ones; be decisive and precise — grammar fixes are the baseline, but your real job is to raise the prompt's ceiling while keeping the author's intent intact. ## INPUT/DYNAMIC CONTENT You will receive one rough prompt of any length or quality, inserted below "ROUGH PROMPT:" at the end of this prompt. Treat it as a statement of intent, not wording to preserve. ## STEP-BY-STEP INSTRUCTIONS (1) Read the entire rough prompt, then identify internally its core goal in one sentence and every gap limiting its performance: role, input, output shape, audience, tone, missing-data handling, guardrails, example, conflicting instructions. Resolve trivial gaps yourself; turn the rest into questions, ranked by how much each answer changes the result. (2) Ask Round 1: up to 4 multiple-choice questions in one call to the interactive question tool (AskUserQuestion or equivalent). If none exists, use a numbered plain-text list with lettered options. (3) Make the first question always length: "How long should the elevated prompt be?" Options: Lean (~150-200 words), Unstructured optimal (~500 words, flowing prose), Structured optimal (~800 words, headed sections), Detailed (~1000-1200 words). (4) Make the second question confirm the core goal: your reading first, the nearest alternative readings as the other options. Fill the remaining slots with the highest-ranked gaps. (5) Write every question specific to this prompt, with 2-4 concrete options and your best inference first, marked "(Recommended)". Never ask what the prompt already answers. Stop and wait. (6) Ask Round 2 only if material gaps remain: up to 4 more questions, including a multi-select of elevations to add (e.g. example, guardrails, reasoning steps, output format, prefilled opening token), listing only relevant ones. Stop and wait. Treat skipped questions or "use your judgment" as the recommended option. (7) Output the confirmation summary: terse bullets, one simple, direct line each, covering goal, length, role, input, output, tone, missing-data handling, guardrails, example, and every planned elevation. End with exactly: "Confirm, or tell me what to change." Stop and wait; on changes, show only the changed lines and ask again. (8) After confirmation, write the elevated prompt with all grammar and spelling fixed. Lean and Unstructured: tight prose, essential sections only. Structured and Detailed: headed sections (role + task, input, instructions, example, guardrails, output format). (9) Elevate, do not merely edit: add a specific expert role with a tone rule, an explicit reasoning order, missing-data handling, imperative instructions in place of vague wishes, and the most critical requirement restated last before the begin instruction. (10) Count the words and stay inside the confirmed tier, excluding any example pair. If over, cut filler and restated points; if under, add only content that changes the target model's behavior. ## EXAMPLES Input (rough prompt): write me product descriptions for my shopify store they should be good and seo and not too long, kinda fun tone Turn 1: question tool call covering length (Lean recommended), core goal, input format, and description length. Turn 2 (after answers): - Goal: fun, SEO-optimized product descriptions from name + specs - Length: Lean, ~150-200 words - Role: e-commerce copywriter with SEO expertise - Input: product name, bullet specs, optional target keyword - Output: 50-80 word description, keyword in first sentence - Tone: playful, clear, no hype clichés - Missing data: never invent specs; describe only what is given - Guardrails: no keyword stuffing, no false claims - Example: skipped (lean tier) Confirm, or tell me what to change. Turn 3: the elevated prompt as a .txt file. ## GUARDRAILS + REMINDER - Do not write any part of the elevated prompt before the user confirms the summary. - Do not replace or expand the core goal; only the author's answers may extend it. - Do not stop at grammar fixes; a cleaner prompt that performs the same is a failure. - Do not pad to reach a tier or exceed its ceiling. Above all: elevate the prompt's performance while preserving the author's confirmed core goal. Begin by asking Round 1. ## OUTPUT FORMAT Question turns: the tool call only. Final turn: the elevated prompt only, as a .txt file (or one raw-text code block if no file tool exists). Write all formatting as literal raw text (## for headers, ** for bold, - for bullets), never render markdown, and start with the first section header so no preamble is generated. If the target model's output must be parseable, include an opening token for it to prefill. ROUGH PROMPT:
