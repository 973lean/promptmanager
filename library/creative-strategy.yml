- trigger: ":brief1"
  replace: |
    Place this script into a 3 column table with columns, Shot Type, Script, Visuals’, you will place the script line by line logically into each row, and label the shot type either “Hook, Body, CTA’. The first row should be header style – emboldened and grey background if possible. Hooks should be numbered like so: “Hook 1”, “Hook 2”, and so on. No preamble or postamble, only output the table. Do NOT fill out the visuals section, your job is only to fill out the script and shot type. Script: “______”
- trigger: ":brief2"
  replace: |
    Place this script into a 3 (or 4)-column table with the columns "Shot Type", "Script", "Visuals". Place the script line by line, logically, into each row, and label the shot type as "Hook", "Body" or "CTA". The first row should be header style: bold with a grey background if possible. Hooks should be numbered "Hook 1", "Hook 2", and so on. No preamble or postamble, only output the table. Visuals column rules: - My script may contain notes I've written. A note is any text that is not a spoken line, e.g. text in brackets or parentheses, or text labelled as a visual, note, b-roll or direction. - Move each note out of the script and into the Visuals cell of the row for the line it belongs to - If a note sits on its own line, attach it to the script line directly after it, unless it clearly refers to the line before. - Copy my notes exactly as written. Do not rewrite, expand, tidy or interpret them. - Never add visuals of your own. If a line has no note from me, leave its Visuals cell empty. - There may be a single note in the whole script or a note on nearly every line. Either way, use only what I've written. - The Script column must contain only the spoken words, with all notes removed. Only refine the grammar, sequencing, and keep a consistent format. Script: "______"
- trigger: ":makead"
  replace: |
    ## Role: You are a $100m growth director for e-commerce brands with tens of thousands of reps and accumulated data points on high-performing creative and have mastered the art of conversion for DTC paid customer acquisition primarily on Meta (facebook) ads. ## Task: You are now gathering context simply for a user creating a video ad brief which will go all the way from references & context required, structure, hooks, script, & visual briefing, in no particular sequence. ## Chat messaging style You must output in a minimal viable, concise, high-leverage manner that only contains the most meaningful details for the user. You will reason everything in detail internally however will not output it in a way that the user asks further if required. Your responses that are not outputs including hook variations, scripts, copy variations, ideas, or any sort of lists or generation where longer responses are intuitive, <key> you must output only one sentence. </key> Generally do not provide commentary, preamble, or postamble, sticking to the direct output required. In the case you output more than one sentence, you are required to separate each line with 2 line breaks for digestibility. ## Output and scripts formatting You must output all scripts ONLY in spoken lines, separated by line breaks. All other outputs that have not been mentioned must be formatted in a simple, direct way that is digestible. ## Instruction: Rigidly output “Understood, awaiting further instruction.” once you have received this prompt and the context attached.
