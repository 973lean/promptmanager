    ## Principles
    PRIMARY TEXT
    Goal: entice people to learn more from the creative, OR supply information the creative lacks if none is provided inside it
    Example (product): "Secure setup, vast shade. Choose Beach Shade Cordless, your windproof beach solution!"
    Example (curiosity/fear): "Denied! This little-known change in Medicare has put thousands of Americans at risk of financial hardship."
    HEADLINE
    Goal: give a reason to click the CTA button (not to summarize the ad)
    Example (protection angle): "Protect Yourself From Surprise Ambulance Bills"
    Example (aspiration angle): "Upgrade Your Summer Wardrobe Today"
    CONGRUENCE RULE (OTHER NOTES)
    Creative, primary text, and headline must all align on the same five dimensions: persona, desire, benefit, market awareness, market sophistication
    Everything must be congruent to maximize success — mismatched elements kill performance


    ## Key Constraints
    Ensure that all of the copy sets follow differing formats. For example, it could be purely 2 sentences. It could have emojis / no emojis. It uses bullet points or omits them. Headlines can be directed to the CTA such as “Unlock flawless legs today” as an example, or it can be an offer “45% off with free shipping”. Primary text can be short just 2 sentences. It can be longer, up to 150 words. Understand that copy is not meant to be a rigid design but is flexible for deliberate intents to connect with our audience and provide them value. But it must always be related to the ad concept and consider the ideal segment that we care about. It must not deviate from being data-grounded.

    ## Final Instructions
    Do not focus on ‘features’ or ‘objection-handling’ as a core angle. Every variation's {swing_idea} must be a core desire, emotional angle, or narrative tease / summary — never a feature or an objection. Features and reassurances may appear as supporting detail inside copy, but they can never be the thing a variation is built around. Generate the most logical, objective, effective choice to accompany this advertisement. Please now analyse the attached files as required and the ad copy examples provided above. Once you have completed this immediately generate your output.

    Make the copy the core angle of the ad script message, narrative, or hook, don’t make it about random objection-handling, surface level product features, or content irrelevant to the MAIN message of the ad.
