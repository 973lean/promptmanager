- trigger: ":clarity"
  replace: |
    ## Clarity over cleverness Principle: clarity over cleverness. The line names the outcome figuratively (“get your bed back”) instead of literally (“stop his snoring”), so the viewer has to decode it before they understand it, and in a one-second scroll they won’t. Why AI does it: models are trained heavily on marketing copy that rewards wit, idiom and variation, so when asked for “different variations” they swap literal words for figurative ones to sound fresh, which trades clarity for novelty. The specific failure in that line: the top half named the problem (snoring) but the bottom half switched to a different, implied outcome (the bed) instead of resolving the problem it just raised. Rules to apply universally: Every line names the literal problem and the literal outcome in the customer’s words, with no metaphors, idioms or euphemisms. The payoff must resolve the exact problem the hook raised, using the same noun (snoring → stop the snoring). Ban figurative outcome verbs: reclaim, get back, take back, unlock, finally, transform, game-changer. Ambiguity test: if a line can be read two ways, or a stranger needs a second to get it, cut it. Cold-viewer test: with sound off and one second, a stranger can say who the ad is for and what problem it solves. Instructions Write every hook literally. Name the exact problem and exact outcome in plain words the customer would use. No metaphors, idioms, wordplay or implied outcomes. The payoff must resolve the same problem the hook raised. If a line needs interpreting, rewrite it.
- trigger: ":transition"
  replace: |
    I'll paste an ad script or excerpt and name the one seam I want to transition across (e.g. hook → problem mechanism, mechanism → product intro, product → close). Give me the 5 strongest transitional concepts for that seam. For each one, give the concept name, one line on why it works here, and a copy example ready to drop in, written in the script's voice. WHAT A GOOD TRANSITION DOES A transition works when it moves the viewer to the next beat while keeping the story's momentum and its "real story, not an ad" frame (think native sales-letter frames like "my wife told me to share this"). It only needs to be plausible and functional, not clever. Polished-but-salesy is worse than simple-but-natural. CORE TECHNIQUES (combine them; invent new ones if they fit better) 1. Authority transfer: a credible person delivers the next claim instead of the narrator (relative, specialist, insider, podcast host). "But here's what I learned from my son's occupational therapist…" 2. Open loop: say something specific is coming without revealing it. "The first thing Korean women learn is…" / "What if coloring your greys was as simple as washing your hair? Meet…" 3. Causal link: present the next beat as the result of the last one. "That's why women are switching to…" / "Together these ingredients create…" 4. Narrative continuity: carry the same character, time and place across the seam so it reads as the next moment of a real story. "My mother went to her suitcase and pulled out a tube she'd brought from Seoul." 5. Belief reframe: name and reject what the viewer already assumes before giving your answer. "It isn't in their paws… it's the gut." / "Drinking more water won't fix it. You need something that…" Strong seams usually combine 2–3 of these. "His OT suggested…" is authority + causal link + continuity in one line. PATTERNS BY STAGE (examples, not limits) - Problem mechanism: direct reveal, belief reframe, advice from an authority figure, whistleblower or expert exposé, narrator's own insider knowledge. - Solution mechanism: an authority suggests it, the viewer's other options are ruled out, the narrator explains it from insider knowledge, a podcast guest explains it. - Product intro: a friend or relative recommends it, an authority recommends it, problem → solution ("that's why…"), social proof, ingredients lead to the product, alternatives are rejected, a new value proposition, the founder's origin story. - Transition to close: a direct move, a compassionate one ("I'm not telling you this to sell you something. I'm telling you because I was you"), a desire preface ("instead of being behind, he'll be ahead… the kit comes with…"), a host's recommendation ("I'm linking this below because our listeners need to see this"). HOW TO CHOOSE Start with what the ad's own narrative and setting make logical: who's speaking, their role, where they are, who's around them (e.g. a doctor saying "this is what I recommend to my patients"). Use those only where the script supports them, and never invent a character or setting that clashes. Then fill the rest with the strongest general techniques. Rank the 5 best first.

