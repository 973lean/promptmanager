- trigger: ":UTShook"
  replace: |
    # Hook Writing Context Sheet Every hook must pass all seven principles below. --- ## 1. Clarity, never cleverness **Principle:** A hook is read once, mid-scroll, by someone who owes you nothing, so the only line that works is one they understand without effort. **Why AI does it:** When asked to sound "engaging" or "different," models reach for moves that look like craft (wordplay, rhyme, twists of phrase) because those stand out in the writing they learned from, even though none of it helps a cold viewer understand faster. **Memo:** Say it the plain way first, and if a plainer version of the line exists, the plainer version wins. **Rules:** 1. Write the plainest version of the hook first, and only change a word if the new word is plainer or more specific. 2. No wordplay, puns, rhymes, alliteration, double meanings or "twist" phrasing. 3. Concrete beats abstract: something the viewer can picture beats a concept like "results," "wellness" or "confidence." 4. Specific beats general: a number, a time frame, a body part or a situation, as far as the data supports it. 5. Plain-swap test: rewrite the line in the plainest words you can, and if the plain version says the same thing, use the plain version. **Instructions:** Write the hook as if explaining the ad to a friend in one sentence. If any word is there to sound good rather than to be understood, replace it. --- ## 2. No ambiguity: no unpinned subject and payoff **Principle:** A hook has two anchors, who it's about and what they get, and if either one is loose the viewer has to guess, and a viewer who has to guess moves on. **Memo:** Pin both anchors: the subject is one clearly identified person or customer type, and the payoff is a clearly identified thing, named in words rather than pointed at. **Rules:** 1. Subject pinned: from the words alone, without the visual, the viewer can tell who this is about and whether it's them. 2. Payoff pinned: the result is a named thing, never a placeholder word (it, this, that, something, what happened). 3. One subject and one payoff per hook. 4. Every word has one reading: check each noun and verb for a second meaning. 5. Second-reader test: show the hook to someone who hasn't seen the ad and ask "who is this about, and what do they get?" If their answer doesn't match yours, it's ambiguous. **Examples (fail):** - "This is why everyone's switching" (who, and to what?) - "I finally figured it out" (figured out what?) - "You've been doing it wrong" (doing what?) - "The results shocked me" (which results?) --- ## 3. 6th-grade language **Principle:** Simple words don't make a hook dumb, they make it fast, so the viewer understands it before deciding whether to scroll. **Memo:** Write the way the customer talks to a friend, at a 6th-grade reading level, and check it with a readability tool rather than by feel. **Rules:** 1. Everyday words: use, not utilise; help, not support; stop, not eliminate. 2. Short sentences: one idea per sentence. 3. No jargon, category terms or brand language unless customers use those exact words in their verbatims. 4. Active voice with real verbs: "she stopped" beats "a reduction was achieved." 5. Score it: run the hook through a Flesch-Kincaid checker, and if it's above grade 6, rewrite it. --- ## 4. Curiosity gap: clear and deliberate **Principle:** Curiosity only pulls when the viewer knows exactly what they don't know yet; a vague mystery just confuses them, and a gap nobody planned is usually one the ad never closes. **Memo:** Before writing, decide the one question the hook will leave open and where in the body it gets answered, then write the hook so that question is obvious. **Rules:** 1. One gap per hook. 2. The open question is specific enough that the viewer could say it out loud. 3. The mystery is the answer, never the subject or the topic, which stay pinned (see principle 2). 4. Every gap is closed in the body, because a gap left open breaks trust. 5. Don't give the answer away in the hook. 6. Gap test: write down the question in the viewer's head after the hook and the moment in the body that answers it; if you can't fill in both, the gap isn't deliberate. **Examples (fail):** - "You need to see this" (no question to answer) - "Nobody talks about this" (about what?) - "Wait for it" (for what?) --- ## 5. Payoff matched to ad function **Principle:** The hook makes a promise and the body keeps it; if the hook promises less than the body delivers, the viewer judges the whole ad by the smaller promise and leaves before the bigger one arrives. **Memo:** Work out what the ad as a whole does for the viewer, its function, and make that the hook's payoff, because one part of the body is never the headline. **Rules:** 1. Write or read the body before the hook. 2. State the ad's function in one sentence: "After this ad, the viewer believes / knows / wants ___." 3. The hook's payoff is that sentence in hook form, not a single scene, feature or early result from inside the body. 4. Never promise more than the body and the data support (see principle 7). 5. Match test: show someone the hook, then the full ad, and ask "did the hook sell this short?" If yes, rewrite. --- ## 6. Flows into the start of the body **Principle:** The viewer stays only if the body's first line feels like the next sentence of the hook; a jump, a reset or a re-introduction breaks the thread the hook just pulled. **Memo:** Read the hook's last line and the body's first line out loud as one piece, and if there's a jump in topic, subject, voice or time, rewrite the join until it sounds like one sentence followed by the next. **Rules:** 1. The body's first line picks up where the hook stops: it starts answering the open question, continues the story, or begins the "how." 2. Same subject, same voice (I / she / you) and same tense on both sides of the join. 3. No reset at the start of the body: no re-introducing the subject and no throat-clearing openers ("Okay so," "Let me explain," "Here's the thing"). 4. The body doesn't open on anything the hook didn't set up: no side topic, backstory or brand intro first. 5. Join test: read the hook and the first body line together, and if a stranger would feel a change of topic, rewrite the join. **Examples (fail at the join):** - The hook ends on a named problem, and the body opens on the brand's founding story. - The hook is in "she," and the body opens in "you." - The hook opens a question, and the body opens with an unrelated claim before answering it. --- ## 7. Qualification based on real data **Principle:** Every claim in a hook (who it's for, what the problem is, which words to use, what result to promise) must trace back to real evidence, because a guessed claim is a guess dressed up as fact. **Memo:** Only use claims backed by high-frequency, consensus customer verbatims or by proven winner ads, and attach a link to the source for every claim; no link, no claim. **Allowed sources:** - Customer verbatims (reviews, comments, surveys, support tickets) where the same point comes up again and again across many customers. - Proven winner ads, judged by the account's own performance data. **Banned sources:** - Industry data or benchmarks - Web search - Competitor claims - A single one-off review - Anything guessed, assumed or inferred, by a person or by AI **Rules:** 1. Every claim in a draft hook has a source link next to it. 2. Use the customer's exact words where you can, because the verbatim is the copy. 3. Note how many verbatims back each claim, because one review is an anecdote, not consensus. 4. A proven winner backs its own claims and wording, not new claims you add to a variation of it. 5. If there's no source, don't soften the claim, cut it.
